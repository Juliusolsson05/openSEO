# compose.yml — OpenSEO production base
# Do NOT edit this file. Use compose.override.yml for customizations.
# https://github.com/Juliusolsson05/openSEO

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openseo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openseo}
      POSTGRES_DB: openseo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openseo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/juliusolsson05/openseo:latest}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openseo:${DB_PASSWORD:-openseo}@postgres:5432/openseo
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      OPENSEO_ENCRYPTION_KEY: ${OPENSEO_ENCRYPTION_KEY:?Set OPENSEO_ENCRYPTION_KEY in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4720}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4720}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IDEOGRAM: ${IDEOGRAM:-}
      PEXELS: ${PEXELS:-}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DISABLE_INLINE_WORKER: ${DISABLE_INLINE_WORKER:-0}
      PUBLIC_CONTENT_COMPANY_ID: ${PUBLIC_CONTENT_COMPANY_ID:-}
    ports:
      - "${PORT:-4720}:3000"
    volumes:
      - uploads_data:/app/uploads

  worker:
    image: ${APP_IMAGE:-ghcr.io/juliusolsson05/openseo:latest}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openseo:${DB_PASSWORD:-openseo}@postgres:5432/openseo
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      OPENSEO_ENCRYPTION_KEY: ${OPENSEO_ENCRYPTION_KEY:?Set OPENSEO_ENCRYPTION_KEY in .env}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IDEOGRAM: ${IDEOGRAM:-}
      PEXELS: ${PEXELS:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4720}
      PUBLIC_CONTENT_COMPANY_ID: ${PUBLIC_CONTENT_COMPANY_ID:-}
      SKIP_MIGRATIONS: "1"
    command: ["npm", "run", "worker"]
    volumes:
      - uploads_data:/app/uploads
    profiles:
      - worker
    healthcheck:
      test: ["CMD-SHELL", "[ $(( $(date +%s) - $(cat /tmp/worker-health 2>/dev/null || echo 0) )) -lt 60 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
