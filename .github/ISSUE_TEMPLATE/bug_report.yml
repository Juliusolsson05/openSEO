name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenSEO version or commit
      description: Output of `git rev-parse --short HEAD` or the Docker image tag.
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose (install.sh)
        - Docker Compose (manual)
        - Local development (npm run dev)
        - Other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output or logs.
      render: shell
    validations:
      required: false
