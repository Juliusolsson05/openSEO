name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare env
        run: |
          cp .env.example .env
          printf '\nAUTH_SECRET=test-auth-secret\n' >> .env
          printf 'OPENSEO_ENCRYPTION_KEY=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=\n' >> .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
