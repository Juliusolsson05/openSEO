name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i 's/^AUTH_SECRET=$/AUTH_SECRET=test-auth-secret-that-is-at-least-32-chars/' .env
          sed -i 's/^OPENSEO_ENCRYPTION_KEY=$/OPENSEO_ENCRYPTION_KEY=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=/' .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
