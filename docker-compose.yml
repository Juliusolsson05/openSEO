services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openseo
      POSTGRES_PASSWORD: openseo
      POSTGRES_DB: openseo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openseo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://openseo:openseo@postgres:5432/openseo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Fail loudly at `docker compose up` if these aren't in .env.
      # The container's instrumentation hook double-checks at boot.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      OPENSEO_ENCRYPTION_KEY: ${OPENSEO_ENCRYPTION_KEY:?OPENSEO_ENCRYPTION_KEY must be set in .env (base64-32-bytes)}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${PORT:-4720}:3000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  redis_data:
  uploads_data:
